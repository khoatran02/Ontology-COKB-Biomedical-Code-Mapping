services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    environment:
      TSKG_ENVIRONMENT: development
      TSKG_DATASET_DIR: /app/data/archive
      TSKG_ONTOLOGY_PATH: /app/ontology/traffic-sign-ontology.ttl
      TSKG_CATALOG_PATH: /app/ontology/catalog/vietnamese-sign-catalog.csv
      TSKG_CATALOG_TTL_PATH: /app/ontology/catalog/vietnamese-sign-catalog.ttl
      TSKG_SHAPES_PATH: /app/ontology/traffic-sign-shapes.ttl
      TSKG_FUSEKI_QUERY_URL: http://fuseki:3030/traffic-signs/query
      TSKG_FUSEKI_UPDATE_URL: http://fuseki:3030/traffic-signs/update
      TSKG_FUSEKI_GSP_URL: http://fuseki:3030/traffic-signs/data
    ports:
      - "8000:8000"
    volumes:
      - api-runtime:/app/runtime
      - ../data:/app/data:ro
      - ../ontology:/app/ontology:ro
    depends_on:
      - fuseki

  fuseki:
    build:
      context: fuseki
      args:
        JENA_VERSION: "6.1.0"
    command:
      - --tdb2
      - --update
      - --loc
      - /fuseki/databases/traffic-signs
      - /traffic-signs
    ports:
      - "127.0.0.1:3030:3030"
    volumes:
      - fuseki-data:/fuseki/databases

volumes:
  api-runtime:
  fuseki-data:

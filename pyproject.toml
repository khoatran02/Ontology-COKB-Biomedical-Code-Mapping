[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ontology-grounded-traffic-sign-kg"
version = "0.1.0"
description = "Ontology-grounded knowledge graph and hybrid retrieval for Vietnamese traffic signs"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
  "faiss-cpu>=1.9,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "owlrl>=7,<8",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "rdflib>=7,<8",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
validation = ["pyshacl>=0.30,<1"]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
traffic-sign-kg = "traffic_sign_kg.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/traffic_sign_kg"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

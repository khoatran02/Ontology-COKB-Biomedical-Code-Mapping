[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ontologyrag-cokb"
version = "0.1.0"
description = "OntologyRAG with a deterministic COKB core for biomedical code mapping"
requires-python = ">=3.11,<3.13"
dependencies = [
  "pandas==2.2.2",
  "openpyxl>=3.1,<4",
  "scikit-learn==1.6.1",
  "pyoxigraph==0.3.22",
  "requests>=2.28.0"
]

[project.optional-dependencies]
validation = ["rdflib>=7,<8", "pyshacl>=0.30,<1"]
llm = [
  "azure-identity",
  "langchain",
  "langchain-openai",
  "langchain-community",
  "openai",
  "python-dotenv",
  "requests",
  "tiktoken",
  "torch",
  "transformers>=4.34.0"
]

[tool.setuptools.packages.find]
include = ["scripts*"]
